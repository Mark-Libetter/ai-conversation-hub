name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AIConversationHub-Windows
            sep: ";"
          - os: macos-latest
            asset: AIConversationHub-macOS
            sep: ":"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build onedir bundle
        # macOS 加 --windowed 生成 .app bundle（小白可右键→打开放行，无需终端）
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pyinstaller --noconfirm --onedir --windowed --name AIConversationHub --add-data "static${{ matrix.sep }}static" desktop_app.py
          else
            pyinstaller --noconfirm --onedir --name AIConversationHub --add-data "static${{ matrix.sep }}static" desktop_app.py
          fi
        shell: bash

      - name: Bundle launcher and user guide (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "packaging/启动.bat" "packaging/使用说明.txt" dist/AIConversationHub/

      - name: Bundle launcher and user guide (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/bundle
          cp -R dist/AIConversationHub.app dist/bundle/
          cp "packaging/start-mac.command" "packaging/使用说明.txt" dist/bundle/
          chmod +x dist/bundle/start-mac.command

      - name: Zip the bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist/AIConversationHub')"

      - name: Zip the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist/bundle')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: false

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/AIConversationHub-Windows/AIConversationHub-Windows.zip
            assets/AIConversationHub-macOS/AIConversationHub-macOS.zip
          generate_release_notes: true
          body: |
            把多个 AI 编程助手（Codex / Claude Code / Hermes / ZCode / QoderWork / WorkBuddy）的对话汇聚成一个可搜索的本地时间线。一键下载、解压即用，无需安装 Python。

            ---

            ## 下载哪个？

            | 文件 | 平台 | 说明 |
            |---|---|---|
            | `AIConversationHub-Windows.zip` | Windows | 解压后双击 `AIConversationHub.exe` 即可 |
            | `AIConversationHub-macOS.zip` | macOS | 解压后见下方说明 |

            ## Windows 安装
            1. 把 zip **完整解压**到一个文件夹（不要在压缩包里直接双击！）
            2. 双击 `AIConversationHub.exe`（或 `启动.bat`）
            3. 自动打开浏览器，在界面里确认数据源即可

            ## macOS 安装
            1. 把 zip **完整解压**到一个文件夹
            2. 首次运行，任选一种方式：
               - **方式 A（推荐）**：双击文件夹里的 `start-mac.command`，它会弹出图形提示，一步步教你打开 App，全程不用碰终端
               - **方式 B**：**右键**点击 `AIConversationHub.app` →「打开」→「仍要打开」（首次需要通过 macOS 安全检查，之后双击即可）
            3. 自动打开浏览器，在界面里确认数据源即可

            > macOS 首次需要「右键 → 打开」是因为本软件没有苹果开发者签名（$99/年）。这是图形化操作，只弹一次，之后双击就能直接用。

            ## 常见问题
            - **双击没反应？** 确认已完整「解压」（不是在压缩包里直接运行）。macOS 首次需要右键打开，直接双击会被系统拦。
            - **会上传我的对话吗？** 不会。软件只在本机运行，服务只绑定 `127.0.0.1`，原始对话只读、不上传任何数据到云端。
            - **找不到数据？** 首次启动会自动发现本机已安装的 AI 助手；如果没找到，在「设置 → 数据源」里手动指定路径。

            更多说明见压缩包内的「使用说明.txt」，或仓库 [README](https://github.com/Mark-Libetter/ai-conversation-hub#readme)。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AIConversationHub-Windows
            sep: ";"
          - os: macos-latest
            asset: AIConversationHub-macOS
            sep: ":"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build onedir bundle
        # macOS 加 --windowed 生成 .app bundle（小白可右键→打开放行，无需终端）
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pyinstaller --noconfirm --onedir --windowed --name AIConversationHub --add-data "static${{ matrix.sep }}static" desktop_app.py
          else
            pyinstaller --noconfirm --onedir --name AIConversationHub --add-data "static${{ matrix.sep }}static" desktop_app.py
          fi
        shell: bash

      - name: Bundle launcher and user guide (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "packaging/启动.bat" "packaging/使用说明.txt" dist/AIConversationHub/

      - name: Bundle launcher and user guide (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/bundle
          cp -R dist/AIConversationHub.app dist/bundle/
          cp "packaging/start-mac.command" "packaging/使用说明.txt" dist/bundle/
          chmod +x dist/bundle/start-mac.command

      - name: Zip the bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist/AIConversationHub')"

      - name: Zip the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('${{ matrix.asset }}', 'zip', 'dist/bundle')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: false

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/AIConversationHub-Windows/AIConversationHub-Windows.zip
            assets/AIConversationHub-macOS/AIConversationHub-macOS.zip
          generate_release_notes: true
          body: |
            一键下载、解压即用，无需安装 Python。

            - **AIConversationHub-Windows.zip**：解压后运行 `AIConversationHub.exe`（或双击 `启动.bat`），自动起服务并打开浏览器。
            - **AIConversationHub-macOS.zip**：解压后，**右键**点击 `AIConversationHub.app` →「打开」→「仍要打开」（首次需要，之后双击即可）。若双击没反应或想省事，可双击文件夹里的 `start-mac.command`，它会弹图形提示一步步引导你。

            数据只保存在本机，原始对话只读；首次启动在界面里确认数据源即可。

name: CI

on:
  push:
    branches: [main, lite]
  pull_request:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all Python (syntax gate)
        run: python -m compileall -q server.py source_adapters.py app_paths.py launcher.py desktop_app.py repair_sources.py companion.py scripts/ci_smoke.py

      - name: Boot server + health + adapter discovery
        run: python scripts/ci_smoke.py
